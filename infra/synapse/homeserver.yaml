report_stats: false
macaroon_secret_key: "xEQZE2loX^R-gGhrffmauoGPFh*.S69lx:#cfceoxz4@e6;-#."
form_secret: "2wC:*bX3ywwmIhEa&2oUy-jvN5AvIqStvboRh^I7M#-=sf#6re"
signing_key_path: "/data/orion.local.signing.key"
trusted_key_servers:
